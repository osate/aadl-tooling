# Checks the publishing credentials without publishing anything.
#
# Every credential here is only exercised at the very end of a release, after a
# build that can take a quarter of an hour. Run this after rotating a token, or
# before cutting a release, so a bad or expired credential costs seconds.

name: Verify credentials

on:
  workflow_dispatch:
  # Tokens expire. Catch that on a schedule rather than during a release.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify publishing credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: osate/homebrew-osate
      PUBLISHER: osate
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install tooling
        working-directory: vscode-extension
        run: npm ci

      # verify-pat authenticates against the publisher and fails if the PAT is
      # invalid, expired, or scoped to a different publisher. It publishes nothing.
      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode-extension
        run: |
          if npx --no-install vsce verify-pat "$PUBLISHER"; then
            echo "✅ VSCE_PAT is valid for publisher '$PUBLISHER'." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ VSCE_PAT failed for publisher '$PUBLISHER'."
              echo ""
              echo "Check that an Azure DevOps publisher with the ID \`$PUBLISHER\` exists at"
              echo "<https://marketplace.visualstudio.com/manage>, and that the token is scoped to"
              echo "**Marketplace → Manage** for **all accessible organizations**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Open VSX
        if: env.OVSX_PAT != ''
        working-directory: vscode-extension
        run: |
          if npx --yes ovsx verify-pat "$PUBLISHER" --pat "$OVSX_PAT"; then
            echo "✅ Open VSX namespace '$PUBLISHER' is reachable." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ Open VSX check failed for namespace '$PUBLISHER'."
              echo "Claim the namespace at <https://open-vsx.org> and sign the publisher agreement."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Push access is what the release needs, and a read-only token would pass a
      # clone. Verify the push path itself without leaving anything behind.
      - name: Homebrew tap push access
        if: env.TAP_TOKEN != ''
        run: |
          if ! git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" /tmp/tap; then
            {
              echo "❌ Could not clone \`$TAP_REPO\`."
              echo "Create the repository and give HOMEBREW_TAP_TOKEN contents:write on it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --quiet --verify HEAD >/dev/null; then
            branch=$(git symbolic-ref --short HEAD)
          else
            # A brand-new tap has no commits, so there is nothing to push and a dry
            # run would fail for the wrong reason. Manufacture a local commit purely
            # to give the push something to offer; --dry-run never writes it, and
            # this clone is thrown away regardless.
            #
            # Pin the branch too, rather than inheriting whatever the runner's
            # init.defaultBranch happens to be: for an empty tap that choice decides
            # which branch the first release creates.
            branch=main
            git commit --quiet --allow-empty -m "write-access probe"
            echo "Tap is empty; probing branch '$branch' with a local throwaway commit."
          fi

          # --dry-run still authenticates and asks the server whether the ref
          # update would be accepted, so a read-only token fails here. Nothing is
          # written to the tap.
          if git push --dry-run \
              "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" \
              "HEAD:refs/heads/$branch"; then
            echo "✅ HOMEBREW_TAP_TOKEN can push to \`$TAP_REPO\` (branch \`$branch\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ HOMEBREW_TAP_TOKEN cannot push to \`$TAP_REPO\`."
              echo "The token needs **contents: read and write** on that repository."
              echo "A read-only token still clones successfully, so only a push reveals this."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Report unset credentials
        run: |
          for pair in "VSCE_PAT:VS Code Marketplace" "OVSX_PAT:Open VSX" "TAP_TOKEN:Homebrew tap"; do
            name=${pair%%:*}
            label=${pair#*:}
            if [ -z "$(printenv "$name")" ]; then
              echo "➖ $name is not set; $label publishing will be skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
