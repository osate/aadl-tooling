name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded push should not keep burning a 2-hour OSATE build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback that needs neither OSATE nor the submodule, so it starts
  # immediately and usually finishes long before the Maven pipeline.
  extension-checks:
    name: Extension lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5

      # Matches the Node that frontend-maven-plugin pins in vscode-extension/pom.xml.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit

  build:
    name: Build and test
    uses: ./.github/workflows/build.yml
    with:
      build-cli: true
      test-extension: true
      upload-artifacts: true

  # Cache keys are immutable, so every moved submodule pin leaves an OSATE entry
  # behind and every pom change leaves a ~900 MB Maven entry behind. Against a
  # 10 GB per-repository limit that would evict the entries we actually want, so
  # delete superseded ones explicitly rather than waiting for the 7-day timeout
  # or the LRU. Only on main, because that is the ref whose caches every branch
  # and pull request reads from.
  prune-caches:
    name: Prune superseded caches
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      OSATE_KEEP: ${{ needs.build.outputs.osate-cache-key }}
      MAVEN_KEEP: ${{ needs.build.outputs.maven-cache-key }}
    steps:
      - name: Delete superseded cache entries
        run: |
          prune() {
            prefix=$1
            keep=$2
            echo "::group::$prefix (keeping $keep)"
            stale=$(gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --key "$prefix" \
              --limit 100 \
              --json key,id,sizeInBytes \
              --jq ".[] | select(.key != \"$keep\") | \"\(.id)\t\(.sizeInBytes)\t\(.key)\"")

            if [ -z "$stale" ]; then
              echo "Nothing to prune."
            else
              printf '%s\n' "$stale" | while IFS="$(printf '\t')" read -r id size key; do
                echo "Deleting $key ($size bytes)"
                gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
              done
            fi
            echo "::endgroup::"
          }

          prune "osate-${{ runner.os }}-" "$OSATE_KEEP"
          prune "maven-${{ runner.os }}-" "$MAVEN_KEEP"

          echo "### Caches after pruning" >> "$GITHUB_STEP_SUMMARY"
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json key,sizeInBytes \
            --jq '.[] | "- \(.sizeInBytes / 1048576 | floor) MB — \(.key)"' \
            >> "$GITHUB_STEP_SUMMARY"
