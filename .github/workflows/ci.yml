name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded push should not keep burning a 2-hour OSATE build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback that needs neither OSATE nor the submodule, so it starts
  # immediately and usually finishes long before the Maven pipeline.
  extension-checks:
    name: Extension lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v5

      # Matches the Node that frontend-maven-plugin pins in vscode-extension/pom.xml.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - run: npm run test:unit

  build:
    name: Build and test
    uses: ./.github/workflows/build.yml
    with:
      build-cli: true
      build-extension: true
      test-extension: true
      upload-artifacts: true

  # Cache keys are immutable, so every moved submodule pin leaves an OSATE entry
  # behind and every pom change leaves a ~900 MB Maven entry behind. Against a
  # 10 GB per-repository limit that would evict the entries we actually want, so
  # delete superseded ones explicitly rather than waiting for the 7-day timeout
  # or the LRU. Only on main, because that is the ref whose caches every branch
  # and pull request reads from.
  prune-caches:
    name: Prune superseded caches
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      OSATE_KEEP: ${{ needs.build.outputs.osate-cache-key }}
      MAVEN_KEEP: ${{ needs.build.outputs.maven-cache-key }}
    steps:
      - name: Delete superseded cache entries
        run: |
          prune() {
            prefix=$1
            keep=$2
            echo "::group::$prefix (keeping $keep)"
            stale=$(gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF" \
              --key "$prefix" \
              --limit 100 \
              --json key,id,sizeInBytes \
              --jq ".[] | select(.key != \"$keep\") | \"\(.id)\t\(.sizeInBytes)\t\(.key)\"")

            if [ -z "$stale" ]; then
              echo "Nothing to prune."
            else
              printf '%s\n' "$stale" | while IFS="$(printf '\t')" read -r id size key; do
                echo "Deleting $key ($size bytes)"
                gh cache delete --repo "$GITHUB_REPOSITORY" "$id"
              done
            fi
            echo "::endgroup::"
          }

          prune "osate-${{ runner.os }}-" "$OSATE_KEEP"
          prune "maven-${{ runner.os }}-" "$MAVEN_KEEP"

          # Pull-request caches live on their own refs, which the prune above
          # deliberately does not touch, and they are the bulk of the usage: one
          # merged pull request left 2 GB behind. They become garbage the moment
          # the pull request stops being open, but nothing reclaims them until the
          # 7-day timeout or the 10 GB limit starts evicting entries we want.
          echo "::group::closed pull-request caches"
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json id,ref,key,sizeInBytes \
            --jq '.[] | select(.ref | startswith("refs/pull/")) | "\(.id)\t\(.ref)\t\(.sizeInBytes)\t\(.key)"' \
            > /tmp/pr-caches || true

          if [ ! -s /tmp/pr-caches ]; then
            echo "No pull-request caches."
          else
            while IFS="$(printf '\t')" read -r id ref size key; do
              number=${ref#refs/pull/}
              number=${number%%/*}
              state=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo UNKNOWN)
              case "$state" in
              OPEN)
                echo "Keeping $key on $ref (#$number is open)"
                ;;
              MERGED | CLOSED)
                echo "Deleting $key on $ref (#$number is $state, $size bytes)"
                gh cache delete --repo "$GITHUB_REPOSITORY" "$id" || true
                ;;
              *)
                echo "Keeping $key on $ref (could not resolve #$number)"
                ;;
              esac
            done < /tmp/pr-caches
          fi
          echo "::endgroup::"

          # The total is the number that matters: GitHub starts evicting by least
          # recent use once a repository passes 10 GB, and the entry it takes is
          # not necessarily one we can cheaply rebuild.
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json key,ref,sizeInBytes > /tmp/caches-after

          {
            total=$(jq '[.[].sizeInBytes] | add // 0' /tmp/caches-after)
            printf '### Caches after pruning — %d MB of 10240 MB\n\n' "$((total / 1048576))"
            echo "| Size | Ref | Key |"
            echo "| --- | --- | --- |"
            jq -r 'sort_by(-.sizeInBytes)[] | "| \(.sizeInBytes / 1048576 | floor) MB | \(.ref) | `\(.key)` |"' \
              /tmp/caches-after
          } >> "$GITHUB_STEP_SUMMARY"
